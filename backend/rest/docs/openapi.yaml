openapi: 3.0.3
info:
  title: TripMate REST API
  version: 1.0.0
  description: |
    OpenAPI documentation for the implemented TripMate FlightPHP routes.
    Updates use PATCH and accept partial objects. No authentication is
    currently implemented.
servers:
  - url: http://127.0.0.1:8000
    description: Local PHP development server
tags:
  - name: Users
  - name: Trips
  - name: Destinations
  - name: Activities
  - name: Expenses
  - name: Packing items
  - name: Weather
paths:
  /weather:
    get:
      tags: [Weather]
      summary: Get current weather for a destination
      description: Retrieves current conditions from the configured weather provider.
      operationId: getCurrentWeather
      parameters:
        - name: destination
          in: query
          required: true
          description: City or destination name to resolve.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: Paris, France
      responses:
        '200':
          description: Current weather returned.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/WeatherResult'
              example:
                data:
                  location:
                    name: Paris
                    region: Ile-de-France
                    country: France
                    local_time: '2026-11-14 17:00'
                  current:
                    last_updated: '2026-11-14 16:45'
                    temperature_c: 12.4
                    feels_like_c: 11.8
                    condition: Partly cloudy
                    condition_icon: //cdn.weatherapi.com/weather/64x64/day/116.png
                    humidity_percent: 67
                    wind_kph: 13.0
                    wind_direction: W
                    precipitation_mm: 0.0
                    uv: 1.0
        '400':
          description: Missing or invalid destination parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: destination query parameter is required.
        '404':
          description: No weather location matched the requested destination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No weather location matched the requested destination.
        '502':
          description: The provider connection failed, rejected the request, or returned invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The weather provider returned an invalid response.
        '503':
          description: Weather service configuration, provider availability, or provider quota issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The weather provider is temporarily unavailable.
        '504':
          description: The weather provider did not respond before the request timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: The weather provider timed out. Please try again later.
        '500':
          $ref: '#/components/responses/InternalServerError'
