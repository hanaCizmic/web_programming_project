          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Positive integer entity ID.
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    BadRequest:
      description: Invalid request body, field value, or ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: amount must be greater than zero.
    NotFound:
      description: The requested record does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Resource not found.
    InternalServerError:
      description: Unexpected application or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal server error.
    DeleteSuccess:
      description: Record deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteSuccess'
          example:
            message: Resource deleted successfully.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Resource not found.
    WeatherResult:
      type: object
      required: [location, current]
      properties:
        location:
          type: object
          required: [name, region, country, local_time]
          properties:
            name:
              type: string
            region:
              type: string
            country:
              type: string
            local_time:
              type: string
              description: Provider local time formatted as YYYY-MM-DD HH:MM.
        current:
          type: object
          required:
            - last_updated
            - temperature_c
            - feels_like_c
            - condition
            - condition_icon
            - humidity_percent
            - wind_kph
            - wind_direction
            - precipitation_mm
            - uv
          properties:
            last_updated:
              type: string
              description: Provider update time formatted as YYYY-MM-DD HH:MM.
            temperature_c:
              type: number
            feels_like_c:
              type: number
            condition:
              type: string
            condition_icon:
              type: string
              format: uri-reference
            humidity_percent:
              type: integer
              minimum: 0
              maximum: 100
            wind_kph:
              type: number
            wind_direction:
              type: string
            precipitation_mm:
              type: number
            uv:
              type: number
    DeleteSuccess:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Resource deleted successfully.
    User:
      type: object
      required: [id, name, email, role, created_at]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Test User
        email:
          type: string
          format: email
          maxLength: 150
          example: test@example.com
        role:
          type: string
          maxLength: 30
          example: user
        created_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-14 10:30:00'
      description: password_hash is intentionally omitted from API responses.
    UserCreate:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 8
          description: Hashed by the service before storage.
    UserPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 150
        password:
          type: string
          minLength: 8
    Trip:
      type: object
      required: [id, user_id, name, destination, start_date, end_date, budget, currency, description]
      properties:
        id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
          maxLength: 100
        destination:
          type: string
          maxLength: 150
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        budget:
          type: string
          description: MySQL DECIMAL amount returned by PDO.
          example: '1500.00'
        currency:
          type: string
          maxLength: 3
          example: EUR
        description:
          type: string
          nullable: true
    TripCreate:
      type: object
      additionalProperties: false
      required: [user_id, name, destination, start_date, end_date]
      properties:
        user_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        destination:
          type: string
          minLength: 1
          maxLength: 150
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        budget:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          default: 0
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          default: BAM
        description:
          type: string
          nullable: true
    TripPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        user_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 100
        destination:
          type: string
          minLength: 1
          maxLength: 150
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        budget:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        description:
          type: string
          nullable: true
    Destination:
      type: object
      required: [id, trip_id, name, country]
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        name:
          type: string
          maxLength: 150
        country:
          type: string
          maxLength: 100
          nullable: true
    DestinationCreate:
      type: object
      additionalProperties: false
      required: [trip_id, name]
      properties:
        trip_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
        country:
          type: string
          maxLength: 100
          nullable: true
    DestinationPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        trip_id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 150
        country:
          type: string
          maxLength: 100
          nullable: true
    Activity:
      type: object
      required: [id, trip_id, destination_id, title, description, activity_date, start_time]
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        destination_id:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 150
        description:
          type: string
          nullable: true
        activity_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          nullable: true
    ActivityCreate:
      type: object
      additionalProperties: false
      required: [trip_id, title, activity_date]
      properties:
        trip_id:
          type: integer
          minimum: 1
        destination_id:
          type: integer
          minimum: 1
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        activity_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          nullable: true
          description: Accepts HH:MM or HH:MM:SS.
    ActivityPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        trip_id:
          type: integer
          minimum: 1
        destination_id:
          type: integer
          minimum: 1
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
          nullable: true
        activity_date:
          type: string
          format: date
        start_time:
          type: string
          format: time
          nullable: true
          description: Accepts HH:MM or HH:MM:SS.
    Expense:
      type: object
      required: [id, trip_id, category, amount, currency, expense_date, description]
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        category:
          type: string
          maxLength: 100
        amount:
          type: string
          description: MySQL DECIMAL amount returned by PDO.
          example: '300.00'
        currency:
          type: string
          maxLength: 3
        expense_date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
          nullable: true
    ExpenseCreate:
      type: object
      additionalProperties: false
      required: [trip_id, category, amount, expense_date]
      properties:
        trip_id:
          type: integer
          minimum: 1
        category:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: number
          exclusiveMinimum: 0
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          default: BAM
        expense_date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
          nullable: true
    ExpensePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        trip_id:
          type: integer
          minimum: 1
        category:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: number
          exclusiveMinimum: 0
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
        expense_date:
          type: string
          format: date
        description:
          type: string
          maxLength: 255
          nullable: true
    PackingItem:
      type: object
      required: [id, trip_id, item_name, is_packed]
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        item_name:
          type: string
          maxLength: 150
        is_packed:
          type: integer
          enum: [0, 1]
    PackingItemCreate:
      type: object
      additionalProperties: false
      required: [trip_id, item_name]
      properties:
        trip_id:
          type: integer
          minimum: 1
        item_name:
          type: string
          minLength: 1
          maxLength: 150
        is_packed:
          oneOf:
            - type: boolean
            - type: integer
              enum: [0, 1]
          default: false
    PackingItemPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        trip_id:
          type: integer
          minimum: 1
        item_name:
          type: string
          minLength: 1
          maxLength: 150
        is_packed:
          oneOf:
            - type: boolean
            - type: integer
              enum: [0, 1]
